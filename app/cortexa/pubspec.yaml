name: cortexa
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.2
  
  # API & Network
  http: ^1.2.2
  dio: ^5.9.0
  retrofit: ^4.7.3
  pretty_dio_logger: ^1.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # AI - Gemini Direct API
  google_generative_ai: ^0.4.6
  flutter_markdown: ^0.7.4  # Markdown rendering for AI responses
  
  # Navigation
  go_router: ^16.3.0
  
  # UI & Utilities
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  uuid: ^4.5.1  # For generating unique IDs
  flex_color_picker: ^3.6.0  # Color picker
  
  # File & Media
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  excel: ^4.0.6  # Excel file parsing
  csv: ^6.0.0  # CSV file parsing
  path_provider: ^2.1.5  # For file paths
  
  # Voice Features
  speech_to_text: ^7.3.0
  record: ^6.2.0
  
  # PDF & Documents
  flutter_pdfview: ^1.4.3
  
  # Video Player
  video_player: ^2.10.0
  chewie: ^1.13.0

  #icons
  cupertino_icons: ^1.0.8
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  retrofit_generator: ^8.2.1
  json_serializable: ^6.8.0
  http_parser: ^4.1.2
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation

flutter:

  
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/template_file.xlsx

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
